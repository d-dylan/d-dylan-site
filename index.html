<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dylan Roberts</title>
<meta name="description" content="Dylan Roberts, Design Director at frog.">
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%234DA3FF'/%3E%3C/svg%3E">
<script>
/* Light-to-dark dial: every colour is mixed from two ends, so any point on the dial works. */
(function(){
  function hx(x){return[1,3,5].map(function(i){return parseInt(x.substr(i,2),16)})}
  function mx(a,b,t){return a.map(function(v,i){return Math.round(v+(b[i]-v)*t)})}
  function rgb(a){return"rgb("+a.join(",")+")"}
  window.__tone=function(v){
    var s=document.documentElement.style,bg=mx(hx("#FFFFFF"),hx("#0B0B0B"),v),ink=v<.5?hx("#121212"):hx("#ECECE4");
    var t={"--bg":bg,"--ink":ink,"--panel":mx(bg,ink,.045),"--soft":mx(bg,ink,.09),"--shade":mx(bg,ink,.065),"--line":mx(bg,ink,.13),"--muted":mx(bg,ink,.52),"--on-ink":bg,"--knock":bg};
    for(var k in t)s.setProperty(k,rgb(t[k]));
    s.colorScheme=v<.5?"light":"dark";
  };
  var v=null;try{v=localStorage.getItem("dr_tone")}catch(e){}
  v=v==null?(matchMedia("(prefers-color-scheme: dark)").matches?1:0):+v;
  window.__toneV=v;window.__tone(v);
})();
</script>
<style>
/* Layout: an open white page with lots of air. The public home is a scrolling
   preview of the work; the private portfolio follows the same quiet system. */
@font-face{font-family:"PP Mori";src:url("assets/fonts/PPMori-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:"PP Mori";src:url("assets/fonts/PPMori-Medium.woff2") format("woff2");font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:"PP Mori";src:url("assets/fonts/PPMori-SemiBold.woff2") format("woff2");font-weight:600;font-style:normal;font-display:swap}
/* PP Mori with a rounder comma (Work Sans) swapped in for "," and ";" only */
@font-face{font-family:"DR Comma";src:url("assets/fonts/Comma-400.woff2") format("woff2");font-weight:400;unicode-range:U+002C,U+003B;font-display:swap}
@font-face{font-family:"DR Comma";src:url("assets/fonts/Comma-500.woff2") format("woff2");font-weight:500 700;unicode-range:U+002C,U+003B;font-display:swap}

:root{
  --bg:#FFFFFF; --panel:#F4F4F3; --soft:#E8E8E7; --ink:#121212; --muted:#8A8A88; --line:#E0E0DF;
  --on-ink:#FFFFFF; --shade:#EFEFEE; --knock:#FFFFFF; --err:#D2402F; --blue:#4DA3FF;
  --sans:"DR Comma","PP Mori",ui-sans-serif,system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --fs-s:14px; --fs-m:16px; --fs-l:clamp(19px,1.55vw,23px); --fs-xl:clamp(28px,3.2vw,46px); --fs-xxl:clamp(48px,8.4vw,128px);
  --g:clamp(18px,2.6vw,36px); --r:6px;
  --ease:cubic-bezier(.2,.7,.1,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0B0B0B;--panel:#161615;--soft:#252524;--ink:#ECECE4;--muted:#8C8C85;--line:#2A2A28;--on-ink:#0B0B0B;--shade:#1D1D1C;--knock:#0B0B0B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0B0B0B;--panel:#161615;--soft:#252524;--ink:#ECECE4;--muted:#8C8C85;--line:#2A2A28;--on-ink:#0B0B0B;--shade:#1D1D1C;--knock:#0B0B0B;color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 var(--fs-m)/1.45 var(--sans);-webkit-font-smoothing:antialiased}
img,video,canvas{max-width:100%;display:block}
a{color:inherit;text-decoration:none}
button,input,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:3px;border-radius:4px}
[hidden]{display:none!important}
.muted{color:var(--muted)}
svg.i{width:15px;height:15px;flex:none}

/* ---------- text-only controls (no lozenges) */
.lk{display:inline-flex;align-items:center;gap:7px;padding:8px 2px;font-size:15px;line-height:1;color:var(--muted);white-space:nowrap;transition:color .2s}
.lk svg{display:block;width:13px;height:13px;margin-top:-1px}
.lk svg.lock{margin-top:-4px}
.lk:hover,.lk[aria-current="page"]{color:var(--ink)}
.lk[aria-current="page"]::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--blue);animation:dot .5s var(--spring)}
@keyframes dot{from{transform:scale(0)}}
.btn{display:inline-flex;align-items:center;gap:10px;font-weight:500;padding:8px 0;white-space:nowrap;transition:opacity .2s}
.btn:hover{opacity:.7}
.btn svg{transition:transform .35s var(--spring)}
.btn:hover svg{transform:translateX(4px)}
.chip{display:inline-flex;align-items:center;gap:8px;font-size:var(--fs-s);padding:6px 0;color:var(--muted);white-space:nowrap;transition:color .2s}
.chip:hover{color:var(--ink)}
.copy{display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.copy:hover{color:var(--muted)}
.copy .ok{color:var(--muted);font-size:var(--fs-s)}
.sig{width:min(220px,50vw);display:block}
.sig svg{width:100%;height:auto;display:block;clip-path:inset(0 100% 0 0);transition:clip-path 2.1s cubic-bezier(.55,.1,.35,1)}
.sig.drawn svg{clip-path:inset(0 0 0 0)}

/* ---------- nav, shared by every page */
.nav{position:absolute;top:0;left:0;right:0;z-index:85;display:flex;align-items:center;gap:18px;padding:18px var(--g)}
.nav .name{font-weight:500;font-size:17px;letter-spacing:-.01em;margin-right:auto;white-space:nowrap}
.nav .links{display:flex;align-items:center;gap:clamp(10px,2vw,26px)}
.dial{position:relative;display:block;width:24px;height:24px;border-radius:50%;border:1.2px solid var(--ink);cursor:grab;touch-action:none;flex:none;margin-left:4px}
.dial:active{cursor:grabbing}
.dial::after{content:"Turn for light or dark";position:absolute;top:calc(100% + 10px);right:-4px;white-space:nowrap;font-size:13px;line-height:1;letter-spacing:-.01em;color:var(--muted);opacity:0;transform:translateY(-3px);transition:opacity .25s,transform .25s;transition-delay:0s;pointer-events:none}
@media (hover:hover){ .dial:hover::after{opacity:1;transform:none;transition-delay:.7s} }
.dial:focus-visible::after{opacity:1;transform:none}
.dial:active::after{opacity:0!important;transition-delay:0s}
.dial .knob{position:absolute;left:50%;top:50%;width:1.4px;height:calc(50% - 1px);margin-left:-.7px;margin-top:calc(1px - 50%);border-radius:1px;background:var(--ink);transform-origin:50% 100%;transform:rotate(var(--a,-135deg))}

/* ---------- public home: the text carries on from the name, top left */
.pubhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--g);padding:18px var(--g) 220px;min-height:100vh;min-height:100dvh}
.txt{max-width:min(560px,62vw);font-size:17px;line-height:1.42;letter-spacing:-.012em;padding-top:5px}
.txt p{margin:0}
.txt .nm{font-weight:500}
.txt .it{font-size:1.05em;letter-spacing:0}
.txt .sub{color:var(--muted);margin-top:14px}
.txt .meta{display:flex;flex-wrap:wrap;gap:8px 26px;align-items:center;margin-top:26px}
.tg{display:inline-flex;align-items:center;gap:8px;font-size:15px;line-height:1;padding:6px 0}
.tg svg{display:block;width:13px;height:13px;transition:transform .45s var(--spring)}
.tg[aria-expanded="true"] svg{transform:rotate(45deg)}
.txt .copy{font-size:15px}
.drop{display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:0fr;transition:grid-template-rows .6s var(--ease)}
.drop.on{grid-template-rows:1fr}
.drop>div{overflow:hidden;min-height:0}
.lgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:18px;border-top:1px solid var(--line)}
.lgrid span,.rec li{opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .7s var(--ease);transition-delay:var(--d,0s)}
.lgrid span{display:grid;place-items:center;height:72px;border-bottom:1px solid var(--line);color:var(--ink)}
.drop.on .lgrid span,.drop.on .rec li{opacity:1;transform:none}
.rec{list-style:none;margin:18px 0 0;padding:0;border-top:1px solid var(--line);font-size:15px}
.rec li{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rec li span:first-child{color:var(--muted);font-variant-numeric:tabular-nums}
.pubhead .links{flex:none;display:flex;align-items:center;gap:clamp(10px,2vw,26px)}
.mini{position:fixed;right:var(--g);bottom:var(--g);z-index:70;width:clamp(200px,20vw,300px);aspect-ratio:16/10;border-radius:8px;overflow:hidden;background:#0B0B0B;color:#fff;box-shadow:0 26px 60px -30px rgba(0,0,0,.55);cursor:zoom-in;transition:transform .5s var(--ease)}
.mini:hover{transform:translateY(-3px)}
.mini{touch-action:none;cursor:grab}
.mini.dragging{cursor:grabbing;transform:scale(1.03);transition:none;box-shadow:0 34px 70px -28px rgba(0,0,0,.6)}
.mini img,.mini video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;visibility:hidden}
.mini img.on,.mini video.on{visibility:visible}
.mini::after{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(transparent 60%,rgba(0,0,0,.45))}
.mini .nm{position:absolute;left:11px;bottom:10px;z-index:2;font-size:13px;font-weight:500;letter-spacing:-.01em}
.mini .ex{position:absolute;right:9px;bottom:9px;z-index:2;display:grid;place-items:center}
.mini .ex svg{display:block;width:13px;height:13px}

/* idle: blue dots slowly cover the page */
.idle{position:fixed;inset:0;z-index:105;pointer-events:none;transition:opacity .45s}
.idle.out{opacity:0}
.idle i{position:absolute;width:clamp(24px,2.6vw,42px);aspect-ratio:1;border-radius:50%;background:var(--blue);transform:translate(-50%,-50%) scale(0);animation:pop .55s var(--spring) forwards}
@keyframes pop{to{transform:translate(-50%,-50%) scale(var(--s,1))}}

/* ---------- portfolio pages */
.page{padding:0 var(--g)}
.wrap{max-width:1440px;margin-inline:auto}
.rise{animation:rise 1.1s var(--ease) both;animation-delay:var(--d,0s)}
@keyframes rise{from{opacity:0;transform:translateY(16px)}}
.hello{font-size:var(--fs-xxl);line-height:1;letter-spacing:-.05em;font-weight:400;margin:0;padding-top:clamp(150px,22vh,240px);text-wrap:balance}
.hello .it{font-size:1em;letter-spacing:-.025em}
.note{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:var(--g);margin-top:clamp(36px,5vw,72px);align-items:start}
.note p{margin:0;font-size:var(--fs-l);line-height:1.4;letter-spacing:-.02em;max-width:36ch}
.note .rushline{display:block;margin-top:14px;padding:0;background:none;border:0;font:inherit;font-size:var(--fs-l);letter-spacing:-.02em;color:var(--muted);text-align:left;cursor:pointer;transition:color .2s}
.note .rushline svg{width:.7em;height:.7em;vertical-align:baseline;margin-left:.25em;transition:transform .4s var(--spring)}
.note .rushline:hover{color:var(--ink)} .note .rushline:hover svg{transform:translateX(4px)}
.about .me{cursor:default}
.peek.tall{width:220px;aspect-ratio:4/5}
.note .prep{font-size:var(--fs-s);color:var(--muted);display:flex;flex-direction:column;gap:3px}
.workhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:clamp(90px,13vw,180px) 0 16px}
.workhead h2{margin:0;font-size:var(--fs-s);font-weight:400;color:var(--muted)}
.toggle{display:flex;gap:16px}
.toggle button{font-size:var(--fs-s);color:var(--muted);display:inline-flex;align-items:center;gap:7px;transition:color .2s}
.toggle button:hover,.toggle button[aria-pressed="true"]{color:var(--ink)}
.list{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.list a{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.3fr) minmax(0,.9fr) 24px;gap:var(--g);align-items:center;padding:26px 0;border-bottom:1px solid var(--line);transition:padding .45s var(--ease)}
.list .c{font-size:var(--fs-l);letter-spacing:-.015em;font-weight:500}
.list .d{color:var(--muted);font-size:var(--fs-s)}
.list .ar{justify-self:end;opacity:.3;transition:transform .4s var(--spring),opacity .2s}
.list a:hover{padding-left:12px}
.list a:hover .ar{opacity:1;transform:translateX(4px)}
.list .th{display:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:calc(var(--g) * 1.5) var(--g)}
.grid a{display:flex;flex-direction:column;gap:14px}
.grid .im{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--shade)}
.grid img{width:100%;height:100%;object-fit:cover;transition:transform .9s var(--ease)}
.grid a:hover img{transform:scale(1.03)}
.grid .t{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.grid .c{font-weight:500;font-size:var(--fs-l);letter-spacing:-.015em}
.grid .l{color:var(--muted);font-size:var(--fs-s);text-align:right}

.peek{position:fixed;left:0;top:0;width:280px;aspect-ratio:4/3;border-radius:var(--r);overflow:hidden;pointer-events:none;z-index:110;opacity:0;transition:opacity .2s;background:var(--shade);box-shadow:0 24px 50px -24px rgba(0,0,0,.45)}
.peek img{width:100%;height:100%;object-fit:cover}
.peek.logo{width:auto;height:auto;aspect-ratio:auto;background:none;box-shadow:none;border-radius:0;overflow:visible;color:var(--ink)}
.peek.logo svg{display:block}
.peek.on{opacity:1}

.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:var(--g);padding-top:clamp(150px,22vh,240px)}
.origin{position:relative;cursor:default}
.origin .hi{position:absolute;left:-4px;bottom:calc(100% + 6px);transform-origin:10% 100%;transform:translateY(6px) rotate(-6deg) scale(.6);opacity:0;pointer-events:none;white-space:nowrap;
  background:var(--ink);color:var(--on-ink);padding:7px 11px 5px;border-radius:12px 12px 12px 3px;font-size:15px;line-height:1.1;letter-spacing:-.01em;transition:opacity .2s,transform .45s var(--spring);z-index:3}
.origin:hover .hi,.origin.on .hi{opacity:1;transform:translateY(0) rotate(-4deg) scale(1)}
.about .origins{grid-column:1/-1;margin:clamp(18px,2vw,28px) 0 0;font-size:var(--fs-l);letter-spacing:-.02em;color:var(--muted)}
.about .origins .origin{color:var(--muted)}
.about .bio{font-size:var(--fs-xl);line-height:1.08;letter-spacing:-.035em;margin:0;grid-column:1/-1;max-width:20em;text-wrap:balance}
.cv{grid-column:2;display:grid;gap:56px;margin-top:clamp(40px,6vw,80px)}
.cv h3{font-size:var(--fs-s);color:var(--muted);font-weight:400;margin:0 0 12px}
.cv ul{list-style:none;margin:0;padding:0;border-top:1px solid var(--line)}
.cv li{display:grid;grid-template-columns:104px minmax(0,1fr);gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.cv .dt{color:var(--muted);font-variant-numeric:tabular-nums;font-size:var(--fs-s);padding-top:2px}
.cv b{font-weight:500}
.cv .sub{display:block;color:var(--muted);font-size:var(--fs-s);margin-top:2px}
.cv [data-logo]{cursor:default;transition:color .2s}
.cv .sub [data-logo]:hover{color:var(--ink)}

.crumbs{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:var(--fs-s);color:var(--muted);padding-top:110px}
.crumbs a:hover{color:var(--ink)}
.ph{padding-block:clamp(40px,7vw,100px) clamp(40px,6vw,80px)}
.ph h1{font-size:var(--fs-xxl);font-weight:500;letter-spacing:-.05em;line-height:.92;margin:0;text-wrap:balance}
.ph .line{font-size:var(--fs-l);margin:20px 0 0;color:var(--muted);letter-spacing:-.01em}
.facts{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:var(--g);margin-top:clamp(36px,5vw,72px)}
.facts dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 22px;font-size:var(--fs-s);align-content:start}
.facts dt{color:var(--muted)} .facts dd{margin:0}
.facts p{margin:0;font-size:var(--fs-l);line-height:1.42;letter-spacing:-.01em;max-width:40ch}
.facts .fs{margin-top:26px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.gal figure{margin:0;border-radius:var(--r);overflow:hidden;background:var(--shade);grid-column:span 2;aspect-ratio:16/9;cursor:zoom-in}
.gal figure.half{grid-column:span 1}
.gal figure.free{aspect-ratio:auto}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .6s ease,transform 1.2s var(--ease)}
.gal img.ok,.gal video{opacity:1}
.gal figure:hover img{transform:scale(1.015)}
.state{grid-column:span 2;border-radius:var(--r);padding:4.2% 4.6%;display:flex;flex-direction:column;justify-content:space-between;gap:40px;aspect-ratio:16/9}
.state{container-type:inline-size}
.state p{margin:0;font-size:10.2cqi;line-height:.96;letter-spacing:-.045em;max-width:8.8em;text-wrap:balance;font-weight:600}
.state .stats b{font-size:5cqi}
.state .stats span{font-size:max(12px,1.5cqi)}
.state{overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:20px}
.stats b{display:block;font-size:clamp(40px,5vw,72px);font-weight:400;letter-spacing:-.04em;line-height:1}
.stats span{font-size:var(--fs-s);opacity:.8}
.next{display:block;margin-top:clamp(90px,12vw,170px);padding-block:30px 12px;border-top:1px solid var(--line)}
.next small{font-size:var(--fs-s);color:var(--muted)}
.next b{display:block;font-size:var(--fs-xxl);font-weight:500;letter-spacing:-.05em;line-height:.95;margin-top:8px;transition:transform .6s var(--ease)}
.next:hover b{transform:translateX(14px)}

/* tools */
.tool{grid-column:span 2;border-radius:var(--r);overflow:hidden;background:var(--panel);display:grid;grid-template-rows:auto minmax(0,1fr) auto}
.tool .th2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 20px 14px;flex-wrap:wrap}
.tool .th2 b{font-weight:500;font-size:var(--fs-l);letter-spacing:-.015em}
.tool .th2 span{color:var(--muted);font-size:var(--fs-s)}
.tool .stage{position:relative;aspect-ratio:16/8;min-height:300px;overflow:hidden;touch-action:none}
.tool canvas{width:100%;height:100%}
.ctrls{display:flex;flex-wrap:wrap;gap:14px 26px;padding:16px 20px 20px;align-items:center}
.ctrl{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:140px;flex:1}
.ctrl .lbl{display:flex;justify-content:space-between;gap:10px}
.ctrl output{color:var(--ink);font-variant-numeric:tabular-nums}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:1px;background:var(--muted)}
input[type=range]::-moz-range-track{height:1px;background:var(--muted)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);margin-top:-8px;transition:transform .3s var(--spring)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:var(--ink)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches span{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);padding:4px 10px 4px 0}
.swatches i{width:16px;height:16px;border-radius:50%}
.pad{position:absolute;right:16px;bottom:16px;width:150px;height:150px;border-radius:12px;background:rgba(255,255,255,.22);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);touch-action:none;cursor:crosshair;border:1px solid rgba(255,255,255,.45)}
.pad .dot{position:absolute;width:22px;height:22px;margin:-11px 0 0 -11px;border-radius:50%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);pointer-events:none}
.pad small{position:absolute;font-size:11px;color:rgba(20,20,20,.75);pointer-events:none}
.mood{position:absolute;left:22px;bottom:16px;font-size:clamp(40px,4.6vw,64px);color:#141414;line-height:1;pointer-events:none}
.flowstage{display:grid;place-items:center;padding:clamp(20px,5vw,60px);background:#0F2B30;color:#fff;cursor:pointer}
.flowtext{font-size:clamp(32px,5.4vw,82px);font-weight:500;letter-spacing:-.04em;line-height:1.02;text-align:center;max-width:12em;position:relative;z-index:2}
.flowtext .w{display:inline-block;white-space:nowrap}
.flowtext .ch{display:inline-block;will-change:transform}
.flowstage svg.rib{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.curve{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.curve svg{width:44px;height:44px;border-radius:6px;background:var(--soft);flex:none}
.tin{flex:2;min-width:200px;height:40px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:0 2px}
.tin:focus{outline:none;border-color:var(--ink)}

.thanks{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:28px;margin-top:clamp(120px,16vw,220px);padding-block:34px 48px;border-top:1px solid var(--line)}
.thanks h2{margin:0;font-size:var(--fs-xl);font-weight:400;letter-spacing:-.035em;line-height:1.05}
.thanks .row{display:flex;gap:10px 26px;flex-wrap:wrap;margin-top:22px;align-items:center}

/* ---------- Full portfolio sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,10,.32);z-index:100;opacity:0;transition:opacity .3s}
.scrim.on{opacity:1}
.sheet{position:fixed;z-index:101;top:10px;right:10px;bottom:10px;width:min(460px,calc(100vw - 20px));background:var(--bg);border-radius:10px;padding:24px clamp(22px,3vw,34px) calc(24px + env(safe-area-inset-bottom,0px));overflow:auto;transform:translateX(calc(100% + 20px));transition:transform .55s var(--ease);display:flex;flex-direction:column;box-shadow:0 30px 80px -30px rgba(0,0,0,.35)}
.sheet.on{transform:none}
.sheet .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:clamp(30px,6vh,64px);font-size:var(--fs-s);color:var(--muted)}
.sheet .x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;transition:transform .45s var(--spring),background .2s}
.sheet .x:hover{transform:rotate(90deg);background:var(--panel)}
.sheet h2{font-size:clamp(30px,3vw,40px);font-weight:400;letter-spacing:-.025em;line-height:1.05;margin:0 0 12px;text-wrap:balance}
.sheet p.lede{color:var(--muted);margin:0 0 30px;max-width:40ch}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:18px}
.field label{font-size:var(--fs-s);color:var(--muted)}
.field input,.field textarea{background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 0;width:100%;resize:vertical;border-radius:0}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--ink)}
.err{color:var(--err);font-size:var(--fs-s);min-height:1.4em;margin:2px 0 10px}
.codein{font-size:clamp(28px,4vw,38px)!important;text-transform:lowercase;letter-spacing:.02em}
.shake{animation:shake .5s var(--ease)}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.or{margin:36px 0 0;padding-top:22px;border-top:1px solid var(--line);font-size:var(--fs-s);color:var(--muted)}
.reqform{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.reqform.on{grid-template-rows:1fr}
.reqform>div{overflow:hidden;min-height:0}
.reqform form{padding-top:24px}
.done{margin:auto 0;display:flex;flex-direction:column;gap:16px}
.done h2{font-size:clamp(44px,6vw,64px)!important}
.mailbox{background:var(--panel);border-radius:6px;padding:14px;font-size:var(--fs-s);white-space:pre-wrap;max-height:220px;overflow:auto}

/* ---------- Viewer: In a rush? stories and full-screen projects */
.viewer{position:fixed;inset:0;z-index:95;background:#0B0B0B;color:#F2F2EE;opacity:0;transition:opacity .35s}
.viewer.on{opacity:1}
.viewer .stage{position:absolute;inset:0;overflow:hidden}
.viewer .stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s ease}
.viewer .stage img.bgb{object-fit:cover;filter:blur(40px) brightness(.45);transform:scale(1.2)}
.viewer .stage img.on{opacity:1}
.viewer .stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .4s ease}
.viewer .stage video.on{opacity:1}
.viewer.quick .stage video{transition:none}
.viewer .stage img.fg.on{animation:drift 7s ease-out both}
@keyframes drift{from{transform:scale(1.045)}to{transform:scale(1)}}
.viewer .hud{position:relative;z-index:3;display:flex;flex-direction:column;gap:14px;padding:calc(14px + env(safe-area-inset-top,0px)) var(--g) 0;background:linear-gradient(rgba(0,0,0,.45),transparent)}
.viewer .segs{display:flex;gap:4px}
.segs span{flex:1;height:2px;background:rgba(255,255,255,.3);overflow:hidden}
.segs i{display:block;height:100%;width:0;background:#fff}
.vtop{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:var(--fs-s)}
.vtop b{font-weight:500;font-size:16px}
.vtop .hint{opacity:.6;margin-left:12px}
.vtop .x{width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.14);color:#fff}
.viewer .cap{position:absolute;z-index:3;left:0;right:0;bottom:0;padding:60px var(--g) calc(24px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:flex-end;gap:20px;background:linear-gradient(transparent,rgba(0,0,0,.6));pointer-events:none}
.viewer .cap>*{pointer-events:auto}
.viewer .cap b{display:block;font-size:clamp(24px,3vw,40px);font-weight:500;letter-spacing:-.03em;line-height:1}
.viewer .cap span{display:block;margin-top:6px;opacity:.75;max-width:none}
@media (min-width:861px){ .viewer .cap span[data-l]{white-space:nowrap} }
.viewer .vlogo{display:block;color:#fff;padding-bottom:4px}
.viewer .vlogo svg{display:block}
.viewer .cap .btn{color:#fff;flex:none}
.viewer .cap .tl{display:inline-flex;align-items:center;gap:.35em;font-size:clamp(24px,3vw,40px)}
.viewer .cap .tl svg{width:.8em!important;height:.8em!important;stroke-width:1.2;transition:transform .4s var(--spring)}
.viewer .cap .tl:hover svg{transform:translateX(5px)}
.viewer .cap .count{font-variant-numeric:tabular-nums;opacity:.75;font-size:var(--fs-s)}
.viewer .zones{position:absolute;inset:0;z-index:2;display:grid;grid-template-columns:1fr 2fr}
.viewer.gallery .zones{grid-template-columns:1fr 1fr}
.viewer.quick .stage img{transition:none}
.viewer.quick .stage .bgb,.viewer.quick .cap{display:none}
.viewer.quick .stage .fg,.viewer.quick .stage video{object-fit:cover}
.viewer.quick .stage img.fg.on{animation:none}
.viewer.fill .stage .bgb{display:none}
.viewer.fill .stage .fg,.viewer.fill .stage video{object-fit:cover}
.viewer .zones button:first-child{cursor:w-resize} .viewer .zones button:last-child{cursor:e-resize}
.viewer .end{position:absolute;inset:0;z-index:4;display:grid;place-content:center;text-align:center;gap:20px;padding:var(--g);background:#0B0B0B}
.viewer .end h2{margin:0;font-size:var(--fs-xl);font-weight:400;letter-spacing:-.025em}
.viewer .end .sig{margin:0 auto;color:#F2F2EE}
.viewer .end .row{display:flex;gap:28px;justify-content:center;flex-wrap:wrap}
.viewer .end .btn{color:#fff}

/* responsive */
@media (max-width:860px){
  .nav{gap:10px}
  .nav .links{gap:12px}
  .lk{font-size:14px}
  .links:has([data-rush]) .lk .lt{display:none}
  @media (max-width:360px){ .pubhead .lk .lt{display:none} }
  .pubhead{flex-direction:column;justify-content:flex-start;gap:18px;padding-bottom:180px}
  .pubhead .links{order:-1;align-self:flex-end}
  .txt{max-width:none}
  .lgrid{grid-template-columns:repeat(3,minmax(0,1fr))}
  .mini{width:46vw;right:12px;bottom:12px}
  .note,.facts,.about{grid-template-columns:1fr}
  .cv{grid-column:1}
  .list a{grid-template-columns:64px minmax(0,1fr) 20px;gap:14px;padding:16px 0}
  .list a:hover{padding-left:0}
  .list .th{display:block;width:64px;aspect-ratio:1;border-radius:4px;overflow:hidden;background:var(--shade)}
  .list .th img{width:100%;height:100%;object-fit:cover}
  .list .d{display:none}
  .list .l{display:block;color:var(--muted);font-size:var(--fs-s);margin-top:2px}
  .list .c{font-size:18px}
  .gal{grid-template-columns:1fr}
  .gal figure,.gal figure.half,.state,.tool{grid-column:span 1}
  .state{padding:5.5%}
  .stats b{font-size:28px}
  .grid{grid-template-columns:1fr}
  .tool .stage{aspect-ratio:4/5}
  .pad{width:118px;height:118px}
  .viewer .cap{flex-direction:column;align-items:flex-start}
  .vtop .hint{display:none}
}
@media (max-width:420px){ .nav .name .last{display:none} }
@media (min-width:861px){ .list .txt{display:contents} .txt .meta{flex-wrap:nowrap;width:max-content} }
@media (hover:none){ .peek{display:none} }
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important}
  html{scroll-behavior:auto}
  .sig svg{clip-path:none}
  .track{flex-wrap:wrap;width:auto} .track [aria-hidden]{display:none}
}

  const pub = !profile;
  return `<header class="nav">
    <a class="name" href="${pub ? "#" : "#work"}">${esc(first)} <span class="last">${esc(last)}</span></a>
    <nav class="links" aria-label="Main">
      ${pub ? "" : `<a class="lk" data-k="work" href="#work" ${cur === "work" ? 'aria-current="page"' : ""}>Work</a>
      <a class="lk" data-k="about" href="#about" ${cur === "about" ? 'aria-current="page"' : ""}>About</a>`}
      ${pub ? `<button class="lk" data-open="access"><span>Full<span class="lt"> portfolio</span></span>${I.lock}</button>` : `<button class="lk" data-rush>${I.clock}<span class="lt">In a rush?</span></button>`}
      <span class="dial" role="slider" tabindex="0" aria-label="Light to dark" aria-valuemin="0" aria-valuemax="100"><span class="knob"></span></span>
    </nav>
  </header>`;
}
let tone = window.__toneV || 0;
function setTone(v, save) {
  tone = Math.max(0, Math.min(1, v)); window.__tone(tone);
  $$(".dial").forEach(d => { d.style.setProperty("--a", (-135 + tone * 270) + "deg"); d.setAttribute("aria-valuenow", Math.round(tone * 100)) });
  if (save) store.set("dr_tone", tone.toFixed(3), true);
}
function bindDial() {
  $$(".dial").forEach(d => {
    const fromEvent = e => { const r = d.getBoundingClientRect(); let a = Math.atan2(e.clientX - (r.left + r.width / 2), -(e.clientY - (r.top + r.height / 2))) * 180 / Math.PI; a = Math.max(-135, Math.min(135, a)); setTone((a + 135) / 270, true) };
    d.addEventListener("pointerdown", e => { d.setPointerCapture(e.pointerId); fromEvent(e) });
    d.addEventListener("pointermove", e => { if (d.hasPointerCapture(e.pointerId)) fromEvent(e) });
    d.addEventListener("wheel", e => { e.preventDefault(); setTone(tone + (e.deltaY > 0 ? .04 : -.04), true) }, { passive: false });
    d.addEventListener("keydown", e => { const s = { ArrowRight: .05, ArrowUp: .05, ArrowLeft: -.05, ArrowDown: -.05 }[e.key]; if (s) { e.preventDefault(); setTone(tone + s, true) } });
    d.addEventListener("dblclick", () => setTone(tone < .5 ? 1 : 0, true));
  });
  setTone(tone);
}

/* ---------- cursor peek: images tilt as they follow; logos float */
const peek = $("#peek");

  raf = peekOn || Math.abs(vx) > .05 ? requestAnimationFrame(loop) : 0;

  const t = e.target.closest("[data-peek],[data-logo]");
  if (!t) return;

  if (key !== peekSrc) {
    peekSrc = key; peekImg = !!t.dataset.peek;
    if (peekImg) { peek.className = "peek" + (t.dataset.shape ? " " + t.dataset.shape : ""); peek.innerHTML = `<img src="${t.dataset.peek}" alt="">` }

  }

    document.body.appendChild(el); document.body.style.overflow = "hidden"; hidePeek();
    requestAnimationFrame(() => el.classList.add("on")); show(idx);
    const [zl, zr] = $$(".zones button", el); let downAt = 0, downX = 0;
    const down = e => { downAt = Date.now(); downX = e.clientX; if (auto) pause(true) };
    const up = d => e => { const held = Date.now() - downAt > 250, dx = e.clientX - downX; if (auto) pause(false); if (Math.abs(dx) > 40) return step(dx < 0 ? 1 : -1); if (!held || !auto) step(d) };

    const next = $(`.stage video[data-i="${idx + 1}"]`, el); if (next && !next.src) { next.src = next.dataset.src; next.preload = "auto" }
    $$(".segs i", el).forEach((b, j) => b.style.width = j < idx || (!auto && j === idx) ? "100%" : "0");
    const tEl = $("[data-t]", el), lg = slides[idx].logo && LOGOS[slides[idx].logo];
    if (lg) tEl.innerHTML = `<span class="vlogo" aria-label="${esc(slides[idx].title)}">${logoHTML(slides[idx].logo, 46, 280)}</span>`; else tEl.textContent = mode === "gallery" ? "" : slides[idx].title;
    $("[data-l]", el).textContent = slides[idx].line;
    const n = $("[data-n]", el); if (n) n.textContent = `${idx + 1} / ${slides.length}`;
    const e_ = $(".end", el); if (e_) e_.remove();
    cancelAnimationFrame(fr);
    if (!auto) return;
    t0 = performance.now();
    const f = now => { if (!el) return; if (!paused) { elapsed = now - t0; const pct = Math.min(1, elapsed / d); const b = $$(".segs i", el)[idx]; if (b) b.style.width = pct * 100 + "%"; if (pct >= 1) return show(idx + 1) } fr = requestAnimationFrame(f) };
    fr = requestAnimationFrame(f);
  }
  function pause(on) { paused = on; const v = el && $(`.stage video[data-i="${idx}"]`, el); if (v) on ? v.pause() : v.play().catch(() => {}); if (!on) t0 = performance.now() - elapsed }
  function end() {
    cancelAnimationFrame(fr);
    const d = document.createElement("div"); d.className = "end";
    d.innerHTML = `<h2>That’s the quick version.</h2><p style="margin:0;opacity:.7">Thanks for your time${profile && profile.company ? ", " + esc(profile.company) : ""}.</p>${sigHTML()}<div class="row"><button class="btn" data-all>See all work ${I.arrow}</button><button class="btn" data-again>Watch again</button></div>`;
    el.appendChild(d);
    const sg = $(".sig", d); if (sg) setTimeout(() => sg.classList.add("drawn"), 200);
    $("[data-again]", d).onclick = () => show(0);
    $("[data-all]", d).onclick = () => { close(); go("work") };
  }
  function keys(e) { if (e.key === "Escape") close(); else if (e.key === "ArrowRight") step(1); else if (e.key === "ArrowLeft") step(-1); else if (e.key === " " && auto) { e.preventDefault(); pause(!paused) } }
  function close() { if (!el) return; cancelAnimationFrame(fr); $$("video", el).forEach(v => v.pause()); document.removeEventListener("keydown", keys); const v = el; el = null; v.classList.remove("on"); document.body.style.overflow = ""; setTimeout(() => v.remove(), 350); const cb = onClose; onClose = null; if (cb) cb() }
  return { open, close };
})();
function openRush() {
  const ids = (profile && profile.rush) || visible().map(p => p.id);
  Viewer.open({ slides: ids.map(id => P[id]).filter(Boolean).map(p => slideOf(p, 7000)), mode: "rush", auto: true });
}

/* ---------- Full portfolio: enter a code, or ask for one */
const Sheet = (() => {
  let scrim, el;
  const top = t => `<div class="top"><span>${t}</span><button class="x" data-x aria-label="Close">${I.x}</button></div>`;
  function open() {
    close(true);
    scrim = document.createElement("div"); scrim.className = "scrim";
    el = document.createElement("aside"); el.className = "sheet"; el.setAttribute("role", "dialog"); el.setAttribute("aria-modal", "true"); el.setAttribute("aria-label", "Full portfolio");
    const codes = S.profiles.length > 0;
    el.innerHTML = `${top("Full portfolio")}
      ${codes ? `<form id="code" novalidate>
        <h2>The full portfolio is private.</h2>
        <p class="lede">${esc(S.landing.requestIntro)}</p>
        <div class="field"><label for="c-code">Access code</label><input id="c-code" class="codein" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <p class="err" aria-live="polite"></p>
        <button class="btn" type="submit">Open portfolio ${I.arrow}</button>
      </form>
      <p class="or">No code yet? <button class="chip" id="askbtn" aria-expanded="false" aria-controls="reqwrap">Ask for one</button></p>` : `<h2>The full portfolio is private.</h2><p class="lede">${esc(S.landing.requestPublic || "Leave your details and I’ll send you a link.")}</p>`}
      <div class="reqform${codes ? "" : " on"}" id="reqwrap"><div>
        <form id="req" novalidate>
          <div class="field"><label for="r-name">Your name</label><input id="r-name" name="name" autocomplete="name" required></div>
          <div class="field"><label for="r-email">Email</label><input id="r-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="r-co">Company</label><input id="r-co" name="company" autocomplete="organization"></div>
          <div class="field"><label for="r-msg">Anything else? <span style="opacity:.7">(optional)</span></label><textarea id="r-msg" name="message" rows="2"></textarea></div>
          <p class="err" aria-live="polite"></p>
          <button class="btn" type="submit">Send request ${I.arrow}</button>
        </form>
      </div></div>`;
    document.body.append(scrim, el);
    requestAnimationFrame(() => { scrim.classList.add("on"); el.classList.add("on") });
    scrim.onclick = () => close(); el.addEventListener("click", e => { if (e.target.closest("[data-x]")) close() });
    document.addEventListener("keydown", esc_);
    setTimeout(() => { const f = $("#c-code", el) || $("#r-name", el); f && f.focus({ preventScroll: true }) }, 420);
    const ask = $("#askbtn", el), wrap = $("#reqwrap", el);
    if (ask) ask.onclick = () => { const on = !wrap.classList.contains("on"); wrap.classList.toggle("on", on); ask.setAttribute("aria-expanded", on); if (on) setTimeout(() => $("#r-name", el).focus({ preventScroll: false }), 350) };
    if (codes) bindCode(); bindRequest();
  }
  const esc_ = e => { if (e.key === "Escape") close() };
  function bindCode() {
    const f = $("#code", el), inp = $("#c-code", el), err = $(".err", f);
    f.onsubmit = e => {
      e.preventDefault();
      const p = profileFor(inp.value);
      if (!p) { err.textContent = "That code doesn’t match. Check the email, or ask for a new one."; inp.classList.remove("shake"); void inp.offsetWidth; inp.classList.add("shake"); return }
      profile = p; store.set("dr_code", p.code); close(); go("work");
    };
  }
  function bindRequest() {
    const f = $("#req", el), err = $(".err", f);
    f.onsubmit = async e => {
      e.preventDefault();
      const d = Object.fromEntries(new FormData(f));
      if (!d.name.trim()) return err.textContent = "Add your name so I know who to reply to.";
      if (!/^\S+@\S+\.\S+$/.test(d.email)) return err.textContent = "That email address looks incomplete.";
      err.textContent = "";
      const ep = S.settings.formEndpoint;
      if (ep) {
        const b = $("button[type=submit]", f); b.disabled = true; b.style.opacity = .6;
        try {
          const r = await fetch(ep, { method: "POST", headers: { "Content-Type": "application/json", Accept: "application/json" }, body: JSON.stringify({ ...d, _subject: `Portfolio request: ${d.name}${d.company ? ", " + d.company : ""}` }) });
          if (!r.ok) throw 0; return done(d);
        } catch { b.disabled = false; b.style.opacity = 1; err.textContent = "That didn’t send. Try again, or email me at " + S.settings.email; return }
      }
      mailFallback(d);
    };
  }
  function done(d) {
    el.innerHTML = `${top("Sent")}<div class="done"><h2>Diolch, ${esc(d.name.split(" ")[0])}.</h2>
      <p class="lede" style="margin:0">That’s Welsh for thank you. I’ll send a link to ${esc(d.email)}, usually within a day.</p>${sigHTML()}</div>`;
    const sg = $(".sig", el); if (sg) setTimeout(() => sg.classList.add("drawn"), 300);
  }
  function mailFallback(d) {
    const subject = `Portfolio request: ${d.name}${d.company ? ", " + d.company : ""}`;
    const body = `Hi Dylan,\n\nI'd love to see your portfolio.\n\nName: ${d.name}\nEmail: ${d.email}\nCompany: ${d.company || "-"}\n\n${d.message || ""}`.trim();
    el.innerHTML = `${top("One last step")}<div class="done" style="margin:0">
      <h2>Almost there.</h2>
      <p class="lede" style="margin:0">Send this to ${esc(S.settings.email)} and I’ll reply with a link.</p>
      <div class="mailbox">${esc("Subject: " + subject + "\n\n" + body)}</div>
      <div style="display:flex;gap:26px;flex-wrap:wrap;align-items:center">
        <a class="btn" href="mailto:${esc(S.settings.email)}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}">Open in email ${I.arrow}</a>
        <button class="copy" data-copy="${esc("Subject: " + subject + "\n\n" + body)}">Copy text ${I.copy}<span class="ok" hidden>Copied</span></button>
      </div></div>`;
  }
  function close(now) {
    document.removeEventListener("keydown", esc_);
    if (!el) return; const a = el, b = scrim; el = scrim = null;
    if (now) { a.remove(); b.remove(); return }
    a.classList.remove("on"); b.classList.remove("on"); setTimeout(() => { a.remove(); b.remove() }, 550);
  }
  return { open };
})();

/* ---------- idle: after a while, blue dots appear, and keep coming the longer you're away */
(() => {
  if (reduce) return;
  const IDLE = 14000; let timer = 0, adder = 0, layer = null, t0 = 0, count = 0;
  const add = () => {
    if (!layer) return;
    const away = (performance.now() - t0) / 1000;
    const i = document.createElement("i");
    i.style.left = Math.random() * innerWidth + "px"; i.style.top = Math.random() * innerHeight + "px";
    i.style.setProperty("--s", (1 + Math.min(away / 40, 4) * Math.random()).toFixed(2));
    layer.appendChild(i); count++;
    if (count < 900) adder = setTimeout(add, Math.max(60, 700 - away * 12));
  };
  const start = () => { layer = document.createElement("div"); layer.className = "idle"; layer.setAttribute("aria-hidden", "true"); document.body.appendChild(layer); t0 = performance.now(); count = 0; add() };
  const wake = () => {
    clearTimeout(timer);
    if (layer) { clearTimeout(adder); const l = layer; layer = null; l.classList.add("out"); setTimeout(() => l.remove(), 500) }
    timer = setTimeout(start, IDLE);
  };
  // only real input counts: tiny pointer jitter and scroll momentum don't reset the timer
  let lx = -1, ly = -1;
  addEventListener("pointermove", e => { if (Math.abs(e.clientX - lx) + Math.abs(e.clientY - ly) > 6) { lx = e.clientX; ly = e.clientY; wake() } }, { passive: true });
  ["pointerdown", "keydown", "wheel", "touchstart"].forEach(ev => addEventListener(ev, wake, { passive: true }));
  wake();
})();

/* ---------- global events */
document.addEventListener("load", e => { if (e.target.tagName === "IMG") e.target.classList.add("ok") }, true);
document.addEventListener("error", e => { if (e.target.tagName === "IMG") e.target.classList.add("ok") }, true);
document.addEventListener("click", e => {
  const t = e.target.closest("[data-open],[data-rush],[data-copy],[data-lock]");
  if (!t) return;
  if (t.dataset.open) Sheet.open();
  else if (t.hasAttribute("data-rush")) openRush();
  else if (t.hasAttribute("data-lock")) { profile = null; store.set("dr_code", null); go("") }
  else if (t.dataset.copy != null) {
    const ok = $(".ok", t), txt = t.dataset.copy;
    const flash = () => { if (ok) { ok.hidden = false; setTimeout(() => ok.hidden = true, 1600) } };
    (navigator.clipboard ? navigator.clipboard.writeText(txt) : Promise.reject()).then(flash).catch(() => { const r = document.createRange(); r.selectNodeContents(t); const s = getSelection(); s.removeAllRanges(); s.addRange(r) });
  }
});

/* ---------- router */
let lastView = "", homeObs = null;
function go(h) { if (location.hash.slice(1) === h) route(); else location.hash = h }
function setCurrent(which) { $$(".nav .lk[data-k]").forEach(a => a.dataset.k === which ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")) }
function finish(h) {
  $$(".sig").forEach(el => { if (SIG && !el.innerHTML) el.innerHTML = SIG; drawSig(el) });
  bindDial();
  const pid = h.startsWith("work/") && P[h.slice(5)];
  document.title = pid ? `${nameOf(pid)} · ${S.settings.name}` : S.settings.name;
}
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  cleanups.forEach(f => { try { f() } catch {} }); cleanups = [];
  hidePeek();
  if (!profile) {
    // the public site is one page: the work preview, with About and Full portfolio over it
    if (lastView !== "home") { viewHome(); scrollTo(0, 0); lastView = "home"; finish(h) }
    if (h === "access") Sheet.open();
    return;
  }
  if (homeObs) { homeObs(); homeObs = null }
  if (h.startsWith("work/")) viewProject(h.slice(5));
  else if (h === "about") viewAbout();
  else if (h === "rush") { viewWork(); openRush() }
  else viewWork();
  lastView = "folio"; scrollTo(0, 0); finish(h);
}
addEventListener("hashchange", route);
route();
})();
</script>
